# Render Blueprint — ONE Docker web service (see /Dockerfile).
# FastAPI answers /api/* and also serves the built React app for every other path, so the
# browser talks to a single origin: no proxy, no rewrite rules, no CORS. /api can never be
# answered by index.html (the cause of "login returns 200 with HTML").
#
# If you previously created a Render "Static Site" for the frontend, delete it (or stop using
# its URL): open the app at this service's URL / your custom domain instead.
services:
  - type: web
    name: noi-leyni
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/
    # persistent folder for logos/photos (UPLOAD_DIR); Render disks need a paid instance
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MONGO_URL
        sync: false # MongoDB Atlas connection string
      - key: DB_NAME
        value: noi_di_leyni
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # public URL of this service, e.g. https://app.tuodominio.it
      - key: APP_URL
        sync: false # same public URL, used in email links
      - key: EMAIL_FROM_NAME
        value: Leinì Volley
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: IMAGE_MAX_MB_MEMBERS
        value: "1" # athletes, families, merchants
      - key: IMAGE_MAX_MB_BOARD
        value: "5" # board / admin
      - key: GMAIL_USER
        sync: false # your Gmail address
      - key: GMAIL_APP_PASSWORD
        sync: false # Google "App password" (16 letters, needs 2-step verification)
      - key: WEBHOOK_CRON_SECRET
        generateValue: true
